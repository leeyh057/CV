<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이윤호 | 프로필</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-muted: #666666;
            --point-silver: #e5e5e5;
            --point-silver-dark: #d0d0d0;
            --point-green: #10b981;
            --point-green-bg: #ecfdf5;
            --point-orange: #f97316;
            --point-orange-bg: #fff7ed;
            --border-color: #f0f0f0;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }

        .top-decor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--point-green) 0%, var(--point-orange) 50%, var(--point-silver-dark) 100%);
        }

        header {
            margin-bottom: 36px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--point-green-bg);
            color: var(--point-green);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .badge::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: var(--point-green);
            border-radius: 50%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--point-silver);
        }

        .card {
            background-color: #fafafa;
            border: 1px solid var(--point-silver);
            border-radius: 12px;
            padding: 20px;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .fav-item {
            background-color: #fafafa;
            border: 1px solid var(--point-silver);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .fav-item:hover {
            transform: translateY(-2px);
            border-color: var(--point-orange);
        }

        .fav-emoji {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 6px;
        }

        .fav-text {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .goal-card {
            background-color: var(--point-orange-bg);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-left: 4px solid var(--point-orange);
            border-radius: 8px 12px 12px 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .goal-emoji {
            font-size: 2rem;
        }

        .goal-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--point-silver);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .favorites-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .fav-item {
                padding: 12px 8px;
            }

            .fav-emoji {
                font-size: 1.5rem;
            }

            .fav-text {
                font-size: 0.85rem;
            }

            .goal-text {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-decor"></div>

        <header>
            <div class="badge">Student & Future Entrepreneur</div>
            <h1>이윤호</h1>
            <p class="subtitle">청주대학교 경영학과 4학년</p>
        </header>

        <main>
            <section class="section">
                <div class="section-title"><span>01</span> 관심 분야</div>
                <div class="card">
                    <p style="font-size: 1.1rem; font-weight: 600;">🚀 창업 (Entrepreneurship)</p>
                </div>
            </section>

            <section class="section">
                <div class="section-title"><span>02</span> 좋아하는 것</div>
                <div class="favorites-grid">
                    <div class="fav-item">
                        <span class="fav-emoji">🍕</span>
                        <span class="fav-text">먹기</span>
                    </div>
                    <div class="fav-item">
                        <span class="fav-emoji">🛌</span>
                        <span class="fav-text">자기</span>
                    </div>
                    <div class="fav-item">
                        <span class="fav-emoji">🎉</span>
                        <span class="fav-text">놀기</span>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-title"><span>03</span> 목표</div>
                <div class="goal-card">
                    <span class="goal-emoji">💰</span>
                    <span class="goal-text">돈 많이 벌기</span>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 Lee Yunho. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
